name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev cmake libffi-dev libssl-dev
          pip install buildozer cython
      - name: Build APK
        run: yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: PredictorFutbol.apk
          path: bin/*.apk
